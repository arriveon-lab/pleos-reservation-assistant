    location ^~ /pleos-phone/api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:18767;
        proxy_set_header Host 127.0.0.1:18767;
        proxy_set_header Origin $phone_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Phone-Test-Operator "";
        proxy_set_header Cookie "";
        proxy_read_timeout 46s;
    }

    location /pleos-phone/ { return 404; }

    location = /api/live/pleos-pairing {
        proxy_pass http://127.0.0.1:18767;
        proxy_set_header Host 127.0.0.1:18767;
        proxy_set_header Origin $phone_origin;
        proxy_set_header Authorization "";
        proxy_set_header X-Phone-Test-Operator 1;
        proxy_set_header Cookie "";
        proxy_read_timeout 8s;
    }
