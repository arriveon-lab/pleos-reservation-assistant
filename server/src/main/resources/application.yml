server:
  address: 127.0.0.1
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/pleos;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
app:
  mode: MOCK
