<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7A8794"/>
    </marker>
  </defs>
  <style>
    .row { font-size: 14px; font-weight: 600; fill: #7A8794; letter-spacing: 1px; }
    .s { fill: #FFFFFF; stroke: #C5CDD5; stroke-width: 1.5; }
    .ext { fill: #F4F6F8; stroke: #C5CDD5; stroke-width: 1.5; }
    .ai { fill: #FFFFFF; stroke: #1D4ED8; stroke-width: 2; }
    .t { font-size: 17px; font-weight: 700; fill: #17202A; }
    .sub { font-size: 13px; fill: #5B6773; }
    .ln { stroke: #7A8794; stroke-width: 1.8; fill: none; }
    .lbl { font-size: 13px; fill: #7A8794; }
  </style>

  <rect width="1200" height="470" fill="#FFFFFF"/>

  <!-- outbound -->
  <text class="row" x="24" y="36">발신</text>
  <rect class="s" x="24" y="52" width="190" height="64" rx="12"/>
  <text class="t" x="119" y="80" text-anchor="middle">승인된 통화 요청</text>
  <text class="sub" x="119" y="102" text-anchor="middle">SQLite에서 1건 배정</text>

  <rect class="s" x="254" y="52" width="190" height="64" rx="12"/>
  <text class="t" x="349" y="80" text-anchor="middle">LiveKit 배정</text>
  <text class="sub" x="349" y="102" text-anchor="middle">통화별 룸 · 에이전트</text>

  <rect class="s" x="484" y="52" width="190" height="64" rx="12"/>
  <text class="t" x="579" y="80" text-anchor="middle">Telkit SIP 발신</text>
  <text class="sub" x="579" y="102" text-anchor="middle">TLS · SRTP · 허용 번호만</text>

  <rect class="ext" x="714" y="52" width="160" height="64" rx="12"/>
  <text class="t" x="794" y="90" text-anchor="middle">식당 직원</text>

  <line x1="214" y1="84" x2="252" y2="84" class="ln" marker-end="url(#a)"/>
  <line x1="444" y1="84" x2="482" y2="84" class="ln" marker-end="url(#a)"/>
  <line x1="674" y1="84" x2="712" y2="84" class="ln" marker-end="url(#a)"/>

  <text class="sub" x="920" y="76">통화당 최대 시간 · 하루 발신 상한</text>
  <text class="sub" x="920" y="96">승인 1건에 1통화 · 자동 재발신 없음</text>

  <!-- conversation loop -->
  <line x1="24" y1="148" x2="1176" y2="148" stroke="#E6EAEE" stroke-width="1.5"/>
  <text class="row" x="24" y="172">대화 (음성 워커)</text>

  <rect class="ext" x="24" y="204" width="160" height="72" rx="12"/>
  <text class="t" x="104" y="246" text-anchor="middle">식당 직원</text>

  <rect class="ai" x="234" y="204" width="200" height="72" rx="12"/>
  <text class="t" x="334" y="234" text-anchor="middle">음성 인식</text>
  <text class="sub" x="334" y="258" text-anchor="middle">AssemblyAI · Silero VAD</text>

  <rect class="ai" x="484" y="204" width="230" height="72" rx="12"/>
  <text class="t" x="599" y="234" text-anchor="middle">대화 판단</text>
  <text class="sub" x="599" y="258" text-anchor="middle">Gemma 4 31B + 예약 도구</text>

  <rect class="ai" x="764" y="204" width="200" height="72" rx="12"/>
  <text class="t" x="864" y="234" text-anchor="middle">음성 합성</text>
  <text class="sub" x="864" y="258" text-anchor="middle">Cartesia Sonic 3</text>

  <line x1="184" y1="240" x2="232" y2="240" class="ln" marker-end="url(#a)"/>
  <line x1="434" y1="240" x2="482" y2="240" class="ln" marker-end="url(#a)"/>
  <line x1="714" y1="240" x2="762" y2="240" class="ln" marker-end="url(#a)"/>
  <path d="M964 240 L1000 240 L1000 190 L104 190 L104 202" class="ln" marker-end="url(#a)"/>

  <line x1="599" y1="276" x2="599" y2="300" class="ln" marker-end="url(#a)"/>
  <rect class="s" x="484" y="302" width="230" height="40" rx="10"/>
  <text class="sub" x="599" y="327" text-anchor="middle" style="fill:#17202A;font-weight:600">조건 · 수락 · 통화 결과 저장</text>

  <text class="sub" x="1030" y="236">모델은 기본값,</text>
  <text class="sub" x="1030" y="256">환경 변수로 교체</text>

  <!-- inbound -->
  <line x1="24" y1="366" x2="1176" y2="366" stroke="#E6EAEE" stroke-width="1.5"/>
  <text class="row" x="24" y="400">식당 회신 (수신)</text>

  <rect class="ext" x="24" y="414" width="160" height="44" rx="10"/>
  <text class="t" x="104" y="442" text-anchor="middle" style="font-size:15px">식당이 전화</text>
  <rect class="s" x="234" y="414" width="200" height="44" rx="10"/>
  <text class="t" x="334" y="442" text-anchor="middle" style="font-size:15px">허용 번호 확인</text>
  <rect class="s" x="484" y="414" width="230" height="44" rx="10"/>
  <text class="t" x="599" y="441" text-anchor="middle" style="font-size:14px">이름 · 날짜 · 시각으로 예약 식별</text>
  <rect class="s" x="764" y="414" width="200" height="44" rx="10"/>
  <text class="t" x="864" y="442" text-anchor="middle" style="font-size:15px">변경 요청으로 저장</text>

  <line x1="184" y1="436" x2="232" y2="436" class="ln" marker-end="url(#a)"/>
  <line x1="434" y1="436" x2="482" y2="436" class="ln" marker-end="url(#a)"/>
  <line x1="714" y1="436" x2="762" y2="436" class="ln" marker-end="url(#a)"/>
  <text class="sub" x="990" y="441">앱에서 사용자 수락 필요</text>
</svg>
