<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17202A"/>
      <stop offset="1" stop-color="#174E86"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF0F6"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- arrival ring: the destination point on the ground -->
  <ellipse cx="256" cy="404" rx="104" ry="28" fill="none" stroke="#34D399" stroke-width="12" opacity="0.9"/>

  <!-- map pin -->
  <path d="M256 404
           C 226 362, 136 284, 136 214
           A 120 120 0 0 1 376 214
           C 376 284, 286 362, 256 404 Z"
        fill="url(#pin)"/>

  <!-- reservation confirmed check -->
  <polyline points="198,216 239,257 316,178"
            fill="none" stroke="#1D4ED8" stroke-width="32"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
